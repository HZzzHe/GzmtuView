# GMU View 原生版 Gradle 配置
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=384m
org.gradle.vfs.watch=false
org.gradle.workers.max=2
android.useAndroidX=true
# AGP 9.0 默认启用 Built-in Kotlin 与 new DSL，与显式 KGP 插件冲突；
# 关闭两者以使用传统 Kotlin 插件方式（与 Flutter 版 android/ 已验证组合一致）
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
kotlin.incremental=false

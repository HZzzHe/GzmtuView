name: Android CI

# 这条 workflow 只做一件事：确认「克隆下来就能编出 release 包」。
# 不签名发布、不上传任何 Release 资产，产物只作为 artifact 存 7 天供 PR 试装。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# 全程只读：不给任何写仓库的权限，被劫持的 PR 也改不了别的东西
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 校验 gradle-wrapper.jar 的官方校验和：被人替换过 wrapper jar 的 PR 在这一步就失败，
      # 后面的 ./gradlew 才允许执行。distributionUrl 指向腾讯镜像不影响这一步。
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # 与开发机同一 JDK（Temurin 21）；源码级兼容仍是 17。
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 37 对应的组件，与开发机装的一致（平台目录名就是 android-37.0）。
      # 许可由该 action 接受，AGP 若要别的 build-tools 版本会自行补下载。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # release 走 R8 + 资源收缩，混淆与反射问题在编译阶段就暴露。
      # 仓库里没有 keystore，app/build.gradle.kts 让 release 回退到 debug 签名，
      # 所以这个产物只能拿来试装，不能当作正式发布物分发。
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: gzmtuview-release-debug-signed-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          # APK 内部已压缩，再压一遍没收益
          compression-level: 0
